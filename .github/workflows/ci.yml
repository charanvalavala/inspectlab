name: Verify InspectLab
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: docker build -t inspectlab .
      - run: |
          docker run -d --name inspection -p 8000:8000 inspectlab
          curl --retry 15 --retry-connrefused --retry-delay 2 -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ > /dev/null
